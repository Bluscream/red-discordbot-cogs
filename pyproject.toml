[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C901",
    "COM812",
    "D107",
    "D203",
    "D213",
    "D415",
    "E501",
    "ERA001",
    "PLR09",
    "PLR1722",
    "T20",
]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101", "D101", "D102", "D103", "ANN201"]
"abc.py" = ["D102"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"  # keep in step with tool.ruff target-version
strict = true
warn_unreachable = true
# Red's command, group and listener decorators carry no type hints, so under strict mode every
# decorated cog method would be reported as "untyped decorator". The methods themselves are
# still fully annotated and checked.
disallow_untyped_decorators = false
# Same cause: Context.send, commands.group and Cog.__init__ in redbot are unannotated.
untyped_calls_exclude = ["redbot"]
